
name: PublicVPNList UDP Candidates

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect UDP candidates
        env:
          PUBLICVPNLIST_TOKEN: ${{ secrets.PUBLICVPNLIST_TOKEN }}
          PUBLIC_DIR: public
        run: python publicvpnlist_udp.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "Site: https://wongvince.github.io/gate/"
          echo "JSON: https://wongvince.github.io/gate/udp_candidates.json"
