
name: VPN Gate Global Server Update

on:
  workflow_dispatch:

  schedule:
    - cron: "15 */2 * * *"

permissions:
  contents: read

concurrency:
  group: vpngate-lxi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31,<3"

      - name: Fetch VPN Gate and publish to LXI
        run: python vpngate.py
        env:
          LXI_UPLOAD_URL: ${{ secrets.LXI_UPLOAD_URL }}
          LXI_UPLOAD_TOKEN: ${{ secrets.LXI_UPLOAD_TOKEN }}
