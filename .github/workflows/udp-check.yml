name: UDP Proxy Candidate Collector

on:
  workflow_dispatch:
  # 如需每小时自动采集，删除下面三行注释
  # schedule:
  #   - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-udp-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Collect UDP candidates
        env:
          PUBLICVPNLIST_TOKEN: ${{ secrets.PUBLICVPNLIST_TOKEN }}
          PUBLIC_DIR: public
        run: python udp_collector.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
      - name: Print result URLs
        run: |
          echo "Site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Candidates: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/udp_candidates.json"
          echo "Subscription: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/v2rayn.txt"
