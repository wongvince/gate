
name: PublicVPNList TCP Checker

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicvpnlist-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Prepare public directory
        run: mkdir -p public

      - name: Run PublicVPNList TCP checker
        run: python publicvpnlist.py
        env:
          PUBLICVPNLIST_TOKEN: ${{ secrets.PUBLICVPNLIST_TOKEN }}
          WORKER_CHECK_URL: https://wong.wong123.ccwu.cc/check?proxy=
          PUBLIC_DIR: public
          API_MAX_LATENCY: "300"
          WORKER_MAX_LATENCY: "300"
          CHECK_CONCURRENCY: "8"
          MAX_CHECK_NODES: "200"
          FRESH_WITHIN: "86400"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
